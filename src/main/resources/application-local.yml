spring:
  application:
    name: inflace
  datasource:
    url: jdbc:postgresql://localhost:15500/inflace
    username: inflace
    password: password
  docker:
    compose:
      enabled: true
      file: spring-boot-docker-compose.yml
      lifecycle-management: start_only
jwt:
  secret: dGVtcC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtMTIzNDU2Nzg5MC1hYmNkZWY=
  expiration: 1296000000
  refresh-expiration: 1209600000

redis:
  host: localhost
  port: 15501
  password: password
  database: 0
  ssl-enabled: false

cookie:
  same-site: Lax
  secure: false

channel:
  sync:
    cooldown-millis: 3600

cors:
  allowed:
    origins:
      - http://localhost:3000

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:inflace-4th-prod}
    region: ${AWS_REGION:ap-northeast-2}
    profile-image-prefix: ${AWS_S3_PROFILE_IMAGE_PREFIX:users}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
