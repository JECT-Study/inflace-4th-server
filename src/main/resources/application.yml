spring:
  profiles:
    default: local
  application:
    name: inflace
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  flyway:
    baseline-on-migrate: true
    out-of-order: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api-docs
    url: /v3/api-docs

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

youtube:
  data-api:
    base-url: ${DATA_API_URL}
    api-key: ${DATA_API_KEY}
  analytics-api:
    base-url: ${ANALYTICS_API_URL}
    access-token: ${ANALYTICS_TEST_ACCESS_TOKEN}
  oauth:
    redirect-uri: ${YOUTUBE_REDIRECT_URI}

local-login:
  google-redirect-uri: ${GOOGLE_LOCAL_REDIRECT_URI}
  youtube-redirect-uri: ${YOUTUBE_LOCAL_REDIRECT_URI}

channel:
  sync:
    cooldown-millis: ${CHANNEL_SYNC_COOLDOWN_MILLIS}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    profile-image-prefix: ${AWS_S3_PROFILE_IMAGE_PREFIX}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

discord:
  error:
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}

resilience4j:
  bulkhead:
    instances:
      youtube-data:
        max-concurrent-calls: ${YOUTUBE_DATA_BULKHEAD_MAX_CONCURRENT_CALLS:16}
        max-wait-duration: ${YOUTUBE_DATA_BULKHEAD_MAX_WAIT_DURATION:500ms}
      youtube-analytics:
        max-concurrent-calls: ${YOUTUBE_ANALYTICS_BULKHEAD_MAX_CONCURRENT_CALLS:12}
        max-wait-duration: ${YOUTUBE_ANALYTICS_BULKHEAD_MAX_WAIT_DURATION:1s}
      openai:
        max-concurrent-calls: ${OPENAI_BULKHEAD_MAX_CONCURRENT_CALLS:8}
        max-wait-duration: ${OPENAI_BULKHEAD_MAX_WAIT_DURATION:200ms}
  ratelimiter:
    instances:
      youtube-data:
        limit-for-period: ${YOUTUBE_DATA_RATE_LIMIT_FOR_PERIOD:20}
        limit-refresh-period: ${YOUTUBE_DATA_RATE_LIMIT_REFRESH_PERIOD:1s}
        timeout-duration: ${YOUTUBE_DATA_RATE_LIMIT_TIMEOUT:500ms}
      youtube-analytics:
        limit-for-period: ${YOUTUBE_ANALYTICS_RATE_LIMIT_FOR_PERIOD:24}
        limit-refresh-period: ${YOUTUBE_ANALYTICS_RATE_LIMIT_REFRESH_PERIOD:1s}
        timeout-duration: ${YOUTUBE_ANALYTICS_RATE_LIMIT_TIMEOUT:1s}
      openai:
        limit-for-period: ${OPENAI_RATE_LIMIT_FOR_PERIOD:8}
        limit-refresh-period: ${OPENAI_RATE_LIMIT_REFRESH_PERIOD:1s}
        timeout-duration: ${OPENAI_RATE_LIMIT_TIMEOUT:200ms}
