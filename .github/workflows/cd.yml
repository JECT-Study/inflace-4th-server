name: CD - Docker Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  DB_URL: ${{ secrets.DB_URL }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
  GOOGLE_LOCAL_REDIRECT_URI: ${{ secrets.GOOGLE_LOCAL_REDIRECT_URI }}
  YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
  YOUTUBE_LOCAL_REDIRECT_URI: ${{ secrets.YOUTUBE_LOCAL_REDIRECT_URI }}
  DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
  DATA_API_URL: ${{ secrets.DATA_API_URL }}
  ANALYTICS_API_URL: ${{ secrets.ANALYTICS_API_URL }}
  CHANNEL_SYNC_COOLDOWN_MILLIS: ${{ secrets.CHANNEL_SYNC_COOLDOWN_MILLIS }}
  JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  INFLACE_VALKEY_URL: ${{ secrets.INFLACE_VALKEY_URL }}
  INFLACE_VALKEY_PORT: ${{ secrets.INFLACE_VALKEY_PORT }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_S3_PROFILE_IMAGE_PREFIX: ${{ secrets.AWS_S3_PROFILE_IMAGE_PREFIX }}
  AWS_S3_PUBLIC_BASE_URL: ${{ secrets.AWS_S3_PUBLIC_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}


jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment (dev or prod)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=dev" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and push image with Jib
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./gradlew clean jib -x test --stacktrace --info

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,ENVIRONMENT,DB_URL,DB_USERNAME,DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,GOOGLE_LOCAL_REDIRECT_URI,YOUTUBE_REDIRECT_URI,YOUTUBE_LOCAL_REDIRECT_URI,DATA_API_KEY,DATA_API_URL,ANALYTICS_API_URL,CHANNEL_SYNC_COOLDOWN_MILLIS,JWT_EXPIRATION,JWT_SECRET,INFLACE_VALKEY_PORT,INFLACE_VALKEY_URL,AWS_S3_BUCKET,AWS_REGION,AWS_S3_PROFILE_IMAGE_PREFIX,AWS_S3_PUBLIC_BASE_URL,OPENAI_API_KEY,DISCORD_ERROR_WEBHOOK_URL
          script: |
            docker pull youcastle/inflace:$IMAGE_TAG
            docker stop inflace || true
            docker rm inflace || true
            docker run -d --name inflace -p 8080:8080 \
              --memory=1200m \
              -e SPRING_PROFILES_ACTIVE=$ENVIRONMENT \
              -e DB_URL=$DB_URL \
              -e DB_USERNAME=$DB_USERNAME \
              -e DB_PASSWORD=$DB_PASSWORD \
              -e GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID \
              -e GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET \
              -e GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI \
              -e GOOGLE_LOCAL_REDIRECT_URI=$GOOGLE_LOCAL_REDIRECT_URI \
              -e YOUTUBE_REDIRECT_URI=$YOUTUBE_REDIRECT_URI \
              -e YOUTUBE_LOCAL_REDIRECT_URI=$YOUTUBE_LOCAL_REDIRECT_URI \
              -e DATA_API_KEY=$DATA_API_KEY \
              -e DATA_API_URL=$DATA_API_URL \
              -e ANALYTICS_API_URL=$ANALYTICS_API_URL \
              -e CHANNEL_SYNC_COOLDOWN_MILLIS=$CHANNEL_SYNC_COOLDOWN_MILLIS \
              -e JWT_EXPIRATION=$JWT_EXPIRATION \
              -e JWT_SECRET=$JWT_SECRET \
              -e INFLACE_VALKEY_PORT=$INFLACE_VALKEY_PORT \
              -e INFLACE_VALKEY_URL=$INFLACE_VALKEY_URL \
              -e AWS_S3_BUCKET=$AWS_S3_BUCKET \
              -e AWS_REGION=$AWS_REGION \
              -e AWS_S3_PROFILE_IMAGE_PREFIX=$AWS_S3_PROFILE_IMAGE_PREFIX \
              -e AWS_S3_PUBLIC_BASE_URL=$AWS_S3_PUBLIC_BASE_URL \
              -e OPENAI_API_KEY=$OPENAI_API_KEY \
              -e DISCORD_ERROR_WEBHOOK_URL=$DISCORD_ERROR_WEBHOOK_URL \
              youcastle/inflace:$IMAGE_TAG
